name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          assert tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'] == version
          assert json.loads(pathlib.Path('frontend/package.json').read_text())['version'] == version
          assert pathlib.Path(f'docs/releases/{version}.md').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/stecik/sensogrid:${{ steps.version.outputs.version }}
            ghcr.io/stecik/sensogrid:latest
          labels: |
            org.opencontainers.image.source=https://github.com/stecik/senso-grid
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "SensoGrid $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
