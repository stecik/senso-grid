# Linux host only. Host BlueZ owns adapter; no privileged container required.
services:
  app:
    volumes:
      - type: bind
        source: /run/dbus
        target: /run/dbus
        read_only: true
        bind:
          create_host_path: false
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
