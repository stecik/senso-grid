[project]
name = "sensogrid"
version = "0.1.0"
description = "Local-first home climate monitoring"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "bleak>=1,<4",
  "influxdb3-python>=0.15,<1",
  "httpx>=0.28,<1",
  "pywebpush>=2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "ty>=0.0.1,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/sensogrid"]
[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["E501", "B008", "ANN401"]

[tool.ty.environment]
python-version = "3.12"
root = [".", "backend"]

[tool.ty.src]
include = ["backend", "scripts", "diagnostics/ble-benchmark/run_debian.py"]

[tool.ty.rules]
possibly-missing-attribute = "error"
